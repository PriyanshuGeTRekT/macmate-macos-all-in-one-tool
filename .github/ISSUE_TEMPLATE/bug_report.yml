name: Bug report
description: Something in MacMate does not work as it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please check the [FAQ](https://github.com/PriyanshuGeTRekT/macos-all-in-one-tool#faq) and the [known limitations](https://github.com/PriyanshuGeTRekT/macos-all-in-one-tool#known-limitations) first, and search the existing issues to see if it has already been reported.

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Apple menu › About This Mac.
      placeholder: "macOS 26.1"
    validations:
      required: true

  - type: input
    id: mac-model
    attributes:
      label: Mac model
      description: Apple menu › About This Mac.
      placeholder: "MacBook Pro 14-inch, M2 Pro, 2023"
    validations:
      required: true

  - type: input
    id: macmate-version
    attributes:
      label: MacMate version
      description: Shown in MacMate's Settings tab. If you built it yourself, give the commit.
      placeholder: "1.1.0"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install MacMate?
      options:
        - Downloaded from GitHub Releases
        - Homebrew
        - Built from source
    validations:
      required: true

  - type: dropdown
    id: accessibility
    attributes:
      label: Is Accessibility access granted to MacMate?
      description: System Settings › Privacy & Security › Accessibility. Window, mouse and keyboard features need it.
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, step by step?
      placeholder: |
        1. Open the Windows tab
        2. Press ⌃⌥←
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include any error message.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag images or videos here if they help explain the problem.

  - type: textarea
    id: selftest
    attributes:
      label: Self-test output (optional)
      description: "Run `/Applications/MacMate.app/Contents/MacOS/MacMate --selftest` in Terminal and paste the output."
      render: text

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Other utilities running at the same time (window managers, mouse tools, keyboard remappers), external displays, mice or keyboards involved.
